
<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.location.replace("home.html");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Chetana Education Society</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f4ff;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 45px 55px;
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .college-name {
      color: #24427d;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #718096;
      font-size: 19px;
      margin-bottom: 42px;
    }

    h2 {
      color: #253247;
      font-size: 34px;
      margin-bottom: 15px;
    }

    .description {
      color: #718096;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .form-box {
      text-align: left;
    }

    label {
      display: block;
      color: #374151;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 20px;
      margin-bottom: 30px;
      border: 1px solid #cbd5e1;
      border-radius: 13px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-button {
      width: 100%;
      padding: 19px;
      background: #2f66e8;
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .login-container {
        padding: 35px 25px;
      }

      .college-name {
        font-size: 25px;
      }

      .subtitle {
        font-size: 16px;
      }

      h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- Keep logo.png.jpg in the same GitHub folder -->
    <img
      src="logo.png.jpg"
      alt="Chetana Education Society Logo"
      class="logo"
    >

    <div class="college-name">
      CHETANA EDUCATION SOCIETY
    </div>

    <div class="subtitle">
      BCA Student Roadmap &amp; Opportunities
    </div>

    <h2>Welcome Back!</h2>

    <p class="description">
      Login to continue your learning journey.
    </p>

    <!-- No JavaScript and no database -->
    <form action="home.html" method="get" class="form-box">

      <label for="username">Email Address</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" class="login-button">
        Login
      </button>

    </form>

  </div>

</body>
</html>
